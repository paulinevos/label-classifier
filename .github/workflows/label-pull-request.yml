name: "Label pull request"

# Runs with secrets against pull requests from forks, so it must never check
# out or execute the pull request head. This action only reads the event
# payload and installs its own pinned code.
on:
  pull_request_target:
    types:
      - "opened"
  workflow_dispatch:
    inputs:
      number:
        description: "Pull request number to label when triggering manually"
        required: true
        type: "string"

permissions:
  contents: "read"
  issues: "write"
  pull-requests: "write"

concurrency:
  group: "label-pull-request-${{ github.event.pull_request.number || inputs.number }}"
  cancel-in-progress: true

jobs:
  label:
    name: "Label pull request"
    runs-on: "ubuntu-latest"

    permissions:
      contents: "read"
      issues: "write"
      pull-requests: "write"

    steps:
      - name: "Suggest and apply labels"
        uses: "paulinevos/label-classifier@3cf1b9487020b3060e1a26ba42832bf60786fc95"
        with:
          number: "${{ inputs.number }}"
          endpoint: "${{ vars.JEV_ENDPOINT }}"
        env:
          JEV_API_KEY: "${{ secrets.JEV_API_KEY }}"
